<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Animal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Detalhes do Animal</h1>
    </div>
    <div id="dog-details"></div>
    <section class="location-notification" aria-label="Envio de localização">
        <p id="location-status" role="status" aria-live="polite">Preparando o envio da localização…</p>
        <button id="retry-location" type="button" hidden>Tentar enviar novamente</button>
    </section>
    <template id="dog-detail-template" src="templates/dogDetail.html"></template>
    <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
    <script defer src="location-email.js"></script>
    <script defer src="script.js"></script>
</body>
</html>
